name: GitHub Copilot CLI update checker

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  update-check:
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull container image
        run: docker pull ghcr.io/tsubakimoto/github-changelog/ghcpcli:dev

      - name: Run container
        shell: bash
        run: |
          set -o pipefail
          docker run --rm ghcr.io/tsubakimoto/github-changelog/ghcpcli:dev 2>&1 | tee docker-output.txt
          container_status=${PIPESTATUS[0]}

          {
            echo '## Docker run output'
            echo '```text'
            cat docker-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$container_status"