name: GitHub Copilot CLI update checker

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-check:
    runs-on: ubuntu-latest
    steps:
      - name: Determine cache dates
        id: dates
        shell: bash
        run: |
          echo "today=$(date -u +%F)" >> "$GITHUB_OUTPUT"
          echo "yesterday=$(date -u --date='yesterday' +%F)" >> "$GITHUB_OUTPUT"

      - name: Restore previous day's Copilot CLI state
        uses: actions/cache/restore@v4
        with:
          path: copilot-cli-state
          key: copilot-cli-state-${{ steps.dates.outputs.yesterday }}-${{ github.run_id }}
          restore-keys: |
            copilot-cli-state-${{ steps.dates.outputs.yesterday }}-

      - name: Install the latest GitHub Copilot CLI
        run: npm install --global @github/copilot

      - name: Record current Copilot CLI version and help
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p copilot-cli-state-current
          copilot version > copilot-cli-state-current/version.txt
          copilot --help > copilot-cli-state-current/help.txt

      - name: Compare with the previous day's Copilot CLI
        shell: bash
        run: |
          set -euo pipefail
          current_version=$(cat copilot-cli-state-current/version.txt)

          {
            echo '## GitHub Copilot CLI update check'
            printf 'Current version: `%s`\n' "$current_version"

            if [ ! -f copilot-cli-state/version.txt ] || [ ! -f copilot-cli-state/help.txt ]; then
              echo 'No state was found for the previous day.'
            elif cmp -s copilot-cli-state/version.txt copilot-cli-state-current/version.txt; then
              echo 'No update detected since the previous day.'
            else
              printf 'Previous version: `%s`\n' "$(cat copilot-cli-state/version.txt)"
              echo '### Changed commands in `copilot --help`'
              if diff -u copilot-cli-state/help.txt copilot-cli-state-current/help.txt > help-diff.txt; then
                echo 'Copilot CLI was updated, but `copilot --help` did not change.'
              else
                awk '/^Commands:$/ { found=1; next } found && /^[^[:space:]]/ { exit } found && /^  [^[:space:]]/ { print }' \
                  copilot-cli-state/help.txt > previous-commands.txt
                awk '/^Commands:$/ { found=1; next } found && /^[^[:space:]]/ { exit } found && /^  [^[:space:]]/ { print }' \
                  copilot-cli-state-current/help.txt > current-commands.txt

                if diff -u previous-commands.txt current-commands.txt > command-diff.txt; then
                  echo 'The help text changed, but no command-level changes were detected.'
                else
                  echo '```diff'
                  grep -E '^[+-][[:space:]]{2}[^[:space:]]' command-diff.txt
                  echo '```'
                fi
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare current Copilot CLI state for caching
        run: |
          rm -rf copilot-cli-state
          mv copilot-cli-state-current copilot-cli-state

      - name: Cache current Copilot CLI state
        uses: actions/cache/save@v4
        with:
          path: copilot-cli-state
          key: copilot-cli-state-${{ steps.dates.outputs.today }}-${{ github.run_id }}
